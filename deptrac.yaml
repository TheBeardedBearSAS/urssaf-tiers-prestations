deptrac:
  paths:
    - ./src
    - ./vendor/psr
  cache_file: var/.deptrac.cache
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
    - name: Contract
      collectors:
        - type: directory
          value: src/Contract/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
    - name: Testing
      collectors:
        - type: directory
          value: src/Testing/.*
    - name: Standalone
      collectors:
        - type: directory
          value: src/Standalone/.*
    - name: SymfonyBridge
      collectors:
        - type: directory
          value: src/Bridge/Symfony/.*
    - name: DoctrineBridge
      collectors:
        - type: directory
          value: src/Bridge/Doctrine/.*
    - name: Psr
      collectors:
        - type: classLike
          value: ^Psr\\
    - name: Symfony
      collectors:
        - type: classLike
          value: ^Symfony\\
    - name: Doctrine
      collectors:
        - type: classLike
          value: ^Doctrine\\
  ruleset:
    Domain: ~
    Contract: ~
    Application:
      - Domain
      - Contract
    Infrastructure:
      - Application
      - Domain
      - Contract
      - Psr
    DoctrineBridge:
      - Domain
      - Contract
      - Application
      - Infrastructure
      - Doctrine
      - Psr
    Testing:
      - Domain
      - Contract
      - Application
      - Infrastructure
    Standalone:
      - Domain
      - Contract
      - Application
      - Infrastructure
      - DoctrineBridge
      - Doctrine
      - Psr
    SymfonyBridge:
      - Domain
      - Contract
      - Application
      - Infrastructure
      - Testing
      - DoctrineBridge
      - Symfony
      - Doctrine
      - Psr
