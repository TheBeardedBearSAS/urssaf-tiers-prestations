# SonarQube Cloud analysis, run by the CI job "sonarcloud" (automatic analysis must stay disabled on SonarQube Cloud).
sonar.organization=thebeardedbearsas
sonar.projectKey=TheBeardedBearSAS_urssaf-tiers-prestations
sonar.projectName=urssaf-tiers-prestations
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/Bridge/Doctrine/Resources/**,src/Bridge/Symfony/Resources/**
sonar.php.coverage.reportPaths=var/coverage/clover.xml
sonar.php.tests.reportPath=var/coverage/junit.xml
sonar.sourceEncoding=UTF-8

# Justified exceptions (same policy as phpstan.neon.dist and mago.toml: each one explained, nothing else ignored).
sonar.issue.ignore.multicriteria=lowestHighest,inheritedTests,exceptionUnderTestCall,exceptionUnderTestNew
# The CI matrix tests the lowest and the highest allowed dependencies on purpose (composer update --prefer-lowest /
# composer update); the locked install (composer install) is used everywhere else.
sonar.issue.ignore.multicriteria.lowestHighest.ruleKey=githubactions:S8546
sonar.issue.ignore.multicriteria.lowestHighest.resourceKey=.github/actions/setup/action.yml
# Contract test classes: their test methods come from the shared contract traits (tests/Functional/Doctrine/Contract).
sonar.issue.ignore.multicriteria.inheritedTests.ruleKey=php:S2187
sonar.issue.ignore.multicriteria.inheritedTests.resourceKey=tests/**/*
# Tests that expect an exception: the call or the instantiation is the action under test, its result never exists.
sonar.issue.ignore.multicriteria.exceptionUnderTestCall.ruleKey=php:S2201
sonar.issue.ignore.multicriteria.exceptionUnderTestCall.resourceKey=tests/**/*
sonar.issue.ignore.multicriteria.exceptionUnderTestNew.ruleKey=php:S1848
sonar.issue.ignore.multicriteria.exceptionUnderTestNew.resourceKey=tests/**/*
