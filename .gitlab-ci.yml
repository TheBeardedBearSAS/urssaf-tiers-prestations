stages:
  - quality
  - test
  - mutation

variables:
  COMPOSER_HOME: "$CI_PROJECT_DIR/var/composer"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/var/composer/cache"
  XDEBUG_MODE: "off"
  # Same extensions as docker/php/Dockerfile (intl, pdo_sqlite, zip, pcov, xdebug) built on top of the official image.
  IMAGE_BASE: "$CI_REGISTRY_IMAGE/php"

cache:
  key: "composer-$CI_JOB_NAME_SLUG"
  paths:
    - var/composer/cache/

# Builds docker/php/Dockerfile for each PHP version (PHP_VERSION build arg) and pushes it to the project registry.
.build-image:
  stage: .pre
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile docker/php/Dockerfile --build-arg PHP_VERSION="$PHP_VERSION" --destination "$IMAGE_BASE:$PHP_VERSION"

build-image:
  extends: .build-image
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3", "8.4"]

# PHP 8.5 is not a supported runtime yet: its jobs may fail without failing the pipeline.
build-image-php8.5:
  extends: .build-image
  allow_failure: true
  variables:
    PHP_VERSION: "8.5"

.php:
  image: "$IMAGE_BASE:$PHP_VERSION"
  needs: ["build-image"]
  variables:
    PHP_VERSION: "8.2"
    DEPS: highest
  before_script:
    - mkdir -p var
    - |
      if [ "$DEPS" = "lowest" ]; then
        composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      else
        composer update --no-interaction --no-progress
      fi

# Quality gates: one job each, same commands as the Makefile targets (`make ci` runs them all locally).
cs:
  extends: .php
  stage: quality
  script:
    - vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

rector:
  extends: .php
  stage: quality
  script:
    - vendor/bin/rector process --dry-run --no-progress-bar

phpstan:
  extends: .php
  stage: quality
  script:
    - vendor/bin/phpstan analyse --memory-limit=-1 --no-progress

mago:
  extends: .php
  stage: quality
  script:
    - vendor/bin/mago lint --minimum-fail-level=note
    - vendor/bin/mago analyze --minimum-fail-level=note

deptrac:
  extends: .php
  stage: quality
  script:
    - vendor/bin/deptrac analyse --no-progress

composer-checks:
  extends: .php
  stage: quality
  script:
    - composer validate --strict
    - composer audit
    - composer normalize --dry-run --diff
    - vendor/bin/composer-require-checker check --config-file=composer-require-checker.json composer.json
    - vendor/bin/composer-unused --no-progress --configuration=composer-unused.php

guard:
  extends: .php
  stage: quality
  before_script: []
  script:
    - if grep -rIil --exclude-dir=vendor --exclude-dir=var --exclude-dir=.git 'extra''bat' . ; then echo "Forbidden word found (see files above)"; exit 1; fi

.tests:
  extends: .php
  stage: test
  script:
    - vendor/bin/phpunit --testsuite=unit,functional

tests:
  extends: .tests
  parallel:
    matrix:
      - PHP_VERSION: ["8.2", "8.3", "8.4"]
        DEPS: ["lowest", "highest"]

tests-php8.5:
  extends: .tests
  needs: ["build-image-php8.5"]
  allow_failure: true
  parallel:
    matrix:
      - PHP_VERSION: ["8.5"]
        DEPS: ["lowest", "highest"]

# 100 % lines / methods / classes over the whole of src (unit + functional suites).
coverage:
  extends: .php
  stage: test
  script:
    - vendor/bin/phpunit --testsuite=unit,functional --coverage-text --coverage-clover var/coverage/clover.xml --coverage-html var/coverage/html --coverage-xml var/coverage/coverage-xml --log-junit var/coverage/junit.xml
    - php bin/check-coverage var/coverage/clover.xml
  coverage: '/^\s*Lines:\s*(\d+\.\d+)%/'
  artifacts:
    expire_in: 1 week
    paths:
      - var/coverage/

# Same as `make infection`: Infection runs its own initial test pass (never --skip-initial-tests, which yields a false
# 100 %); the timeout comes from infection.json5.
infection:
  extends: .php
  stage: mutation
  needs: ["build-image"]
  script:
    - vendor/bin/infection --min-msi=100 --min-covered-msi=100 --threads=max --show-mutations --no-progress --test-framework-options="--testsuite=unit,functional"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - var/infection/

contract:
  extends: .php
  stage: test
  when: manual
  allow_failure: true
  variables:
    # Masked CI/CD variables to define in the project settings:
    #   URSSAF_SANDBOX_CLIENT_ID, URSSAF_SANDBOX_CLIENT_SECRET
    PHP_VERSION: "8.2"
    DEPS: highest
  script:
    - vendor/bin/phpunit --testsuite=contract
