name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      contract:
        description: Run the contract tests against the URSSAF sandbox (needs repository secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'
  XDEBUG_MODE: 'off'

jobs:
  # Quality gates: one job each, same commands as the Makefile targets (`make ci` runs them all locally in Docker).
  quality:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [cs, rector, phpstan, mago, deptrac, composer-checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php-version: '8.2'
          dependencies: locked
      - name: php-cs-fixer
        if: matrix.gate == 'cs'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none
      - name: rector
        if: matrix.gate == 'rector'
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: phpstan
        if: matrix.gate == 'phpstan'
        run: vendor/bin/phpstan analyse --memory-limit=-1 --no-progress
      - name: mago
        if: matrix.gate == 'mago'
        run: |
          vendor/bin/mago lint --minimum-fail-level=note
          vendor/bin/mago analyze --minimum-fail-level=note
      - name: deptrac
        if: matrix.gate == 'deptrac'
        run: vendor/bin/deptrac analyse --no-progress
      - name: composer checks
        if: matrix.gate == 'composer-checks'
        run: |
          composer validate --strict
          composer audit
          composer normalize --dry-run --diff
          vendor/bin/composer-require-checker check --config-file=composer-require-checker.json composer.json
          vendor/bin/composer-unused --no-progress --configuration=composer-unused.php

  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbidden word
        run: |
          if grep -rIil --exclude-dir=vendor --exclude-dir=var --exclude-dir=.git 'extra''bat' . ; then
            echo "Forbidden word found (see files above)"
            exit 1
          fi

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dockerfile lint (.hadolint.yaml)
        run: >-
          docker run --rm -v "$PWD":/repo:ro -w /repo
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint docker/php/Dockerfile

  flex-endpoint:
    # Builds the Flex endpoint of the recipe (recipe/) to check it; the recipe itself is published in symfony/recipes-contrib.
    name: flex endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - run: bin/build-flex-endpoint var/flex-endpoint https://flex.invalid/urssaf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flex-endpoint
          path: var/flex-endpoint

  tests:
    name: tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    # PHP 8.5 is not a supported runtime yet: its jobs may fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [lowest, highest]
        experimental: [false]
        include:
          - { php: '8.5', dependencies: lowest, experimental: true }
          - { php: '8.5', dependencies: highest, experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies }}
      - run: vendor/bin/phpunit --testsuite=unit,functional

  # 100 % lines / methods / classes over the whole of src (unit + functional suites).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload through OIDC (no token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php-version: '8.2'
          dependencies: locked
          coverage: pcov
      - run: >-
          vendor/bin/phpunit --testsuite=unit,functional --coverage-text --coverage-clover var/coverage/clover.xml
          --coverage-html var/coverage/html --coverage-xml var/coverage/coverage-xml --log-junit var/coverage/junit.xml
      - run: php bin/check-coverage var/coverage/clover.xml
      # Public report: https://app.codecov.io/gh/<owner>/<repo>. Public repositories only (OIDC, Codecov GitHub app).
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.event.repository.private == false
        with:
          use_oidc: true
          files: var/coverage/clover.xml
          disable_search: true
          fail_ci_if_error: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: var/coverage/
          retention-days: 7

  # Same as `make infection`: Infection runs its own initial test pass (never --skip-initial-tests, which yields a false
  # 100 %); the timeout comes from infection.json5.
  infection:
    name: infection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php-version: '8.2'
          dependencies: locked
          coverage: pcov
      # The mutation report of main is published on the Stryker Dashboard (infection.json5, logs.stryker) when the
      # repository secret STRYKER_DASHBOARD_API_KEY is set; without it, Infection skips the upload.
      - run: |
          if [ -z "$STRYKER_DASHBOARD_API_KEY" ]; then unset STRYKER_DASHBOARD_API_KEY; fi
          vendor/bin/infection --min-msi=100 --min-covered-msi=100 --threads=max --show-mutations --no-progress \
            --test-framework-options="--testsuite=unit,functional"
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: infection
          path: var/infection/
          retention-days: 7

  # SonarQube Cloud analysis (quality gate, reliability, security, maintainability), fed with the coverage and JUnit
  # reports of the coverage job. Public repositories only, when the SONAR_TOKEN secret is set and the repository
  # variable SONARCLOUD is `enabled` (set once the project is imported on SonarQube Cloud).
  sonarcloud:
    name: sonarcloud
    needs: coverage
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: var/coverage
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        if: env.SONAR_TOKEN != '' && vars.SONARCLOUD == 'enabled'

  # PHPBench (tools/phpbench, out of the package dependencies). On a pull request, the benchmarks of the branch also run
  # against the base commit in the same job, and the job fails on a regression of more than 20 %.
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          php-version: '8.4'
          dependencies: locked
      - run: composer install --no-progress --working-dir=tools/phpbench
      - name: Baseline (base commit, benchmarks of the branch)
        if: github.event_name == 'pull_request'
        run: |
          git worktree add var/base "${{ github.event.pull_request.base.sha }}"
          rm -rf var/base/tests/Benchmark && cp -R tests/Benchmark var/base/tests/Benchmark && cp phpbench.json var/base/
          composer install --no-progress --working-dir=var/base
          if (cd var/base && ../../tools/phpbench/vendor/bin/phpbench run --tag=base --store); then
            mkdir -p var/phpbench && cp -R var/base/var/phpbench/. var/phpbench/
            echo "BASELINE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::The benchmarks do not run on the base commit: no comparison."
          fi
      - name: Benchmarks
        run: |
          if [ "${BASELINE:-0}" = 1 ]; then
            tools/phpbench/vendor/bin/phpbench run --report=urssaf --ref=base \
              --assert="mode(variant.time.avg) <= mode(baseline.time.avg) +/- 20%"
          else
            tools/phpbench/vendor/bin/phpbench run --report=urssaf --store --tag=current
          fi

  # Manual only: Actions > CI > Run workflow > "contract". Repository secrets URSSAF_SANDBOX_CLIENT_ID and
  # URSSAF_SANDBOX_CLIENT_SECRET are required; the other sandbox variables are optional repository variables.
  contract:
    name: contract (URSSAF sandbox)
    if: github.event_name == 'workflow_dispatch' && inputs.contract
    runs-on: ubuntu-latest
    environment: urssaf-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          php-version: '8.2'
          dependencies: locked
      - run: vendor/bin/phpunit --testsuite=contract
        env:
          URSSAF_SANDBOX_CLIENT_ID: ${{ secrets.URSSAF_SANDBOX_CLIENT_ID }}
          URSSAF_SANDBOX_CLIENT_SECRET: ${{ secrets.URSSAF_SANDBOX_CLIENT_SECRET }}
          URSSAF_SANDBOX_BASE_URI: ${{ vars.URSSAF_SANDBOX_BASE_URI }}
          URSSAF_SANDBOX_CUSTOMER_ID: ${{ vars.URSSAF_SANDBOX_CUSTOMER_ID }}
          URSSAF_SANDBOX_INTERVENANT: ${{ vars.URSSAF_SANDBOX_INTERVENANT }}
          URSSAF_SANDBOX_CUSTOMER_BIRTH_DATE: ${{ vars.URSSAF_SANDBOX_CUSTOMER_BIRTH_DATE }}
          URSSAF_SANDBOX_BILLING_ID: ${{ vars.URSSAF_SANDBOX_BILLING_ID }}
