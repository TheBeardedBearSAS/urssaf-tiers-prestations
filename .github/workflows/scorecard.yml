# OpenSSF Scorecard: supply-chain security checks, results published to the public API (badge) and to code scanning.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the workflows (Token-Permissions, Dangerous-Workflow checks)
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish the results (badge, public API)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
