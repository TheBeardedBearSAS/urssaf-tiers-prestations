# Signed release assets: the distribution archive (same content as the Composer dist, export-ignore applied), its
# SHA256SUMS and a SLSA build provenance attestation (Sigstore bundle, `.intoto.jsonl`), attached to the GitHub release.
# Verify with: gh attestation verify <archive>.zip -R <owner>/<repo>
# Runs when a release is published; `workflow_dispatch` signs an existing release (the tag is checked out, so it works
# for tags created before this workflow existed).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing GitHub release to sign (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  assets:
    name: signed assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the assets to the release
      id-token: write # Sigstore keyless signing of the provenance
      attestations: write # store the attestation (gh attestation verify)
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag and the release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid tag: $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Build the distribution archive
        id: dist
        run: |
          name="${GITHUB_REPOSITORY#*/}-${TAG}"
          mkdir dist
          git archive --format=zip --prefix="${name}/" --output="dist/${name}.zip" HEAD
          (cd dist && sha256sum "${name}.zip" > SHA256SUMS && cat SHA256SUMS)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            dist/${{ steps.dist.outputs.name }}.zip
            dist/SHA256SUMS

      - name: Upload the assets to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          NAME: ${{ steps.dist.outputs.name }}
        run: |
          jq -c . "$BUNDLE" > "dist/${NAME}.intoto.jsonl"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/${NAME}.zip" dist/SHA256SUMS "dist/${NAME}.intoto.jsonl"
